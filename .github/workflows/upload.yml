name: Publish central publication dataset

on:
  push:
    branches:
      - automation/map-snapshot
    paths:
      - snapshots/cmu-engineering-publications.parquet
      - snapshots/cmu-engineering-publications.parquet.manifest.json
  workflow_dispatch:
    inputs:
      snapshot_ref:
        description: Git ref containing the validated raw snapshot
        required: true
        default: automation/map-snapshot
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: central-publication-upload-v1
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: huggingface
    env:
      SNAPSHOT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.snapshot_ref || github.sha }}
    steps:
      - name: Check out trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false
      - name: Check out collected snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SNAPSHOT_REF }}
          path: snapshot
          persist-credentials: true
          sparse-checkout: |
            snapshots/cmu-engineering-publications.parquet
            snapshots/cmu-engineering-publications.parquet.manifest.json
            data/authors
            data/captures
            status
          sparse-checkout-cone-mode: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/pyproject.toml
      - name: Install trusted publisher
        run: python -m pip install './source[publisher]'
      - name: Require evidenced primary homes for included Scholar profiles
        run: |
          python source/scripts/validate_primary_homes.py \
            --people source/registry/people.csv \
            --memberships source/registry/memberships.csv \
            --departments source/registry/departments.csv \
            --baseline source/registry/reviews/2026-10-25-implicit-scholar-primary-baseline.json
      - name: Require complete Mathematical Sciences Scholar captures
        run: |
          map-validate-math-coverage \
            --snapshot snapshot/snapshots/cmu-engineering-publications.parquet \
            --manifest snapshot/snapshots/cmu-engineering-publications.parquet.manifest.json \
            --people source/registry/people.csv \
            --memberships source/registry/memberships.csv \
            --departments source/registry/departments.csv \
            --cache-dir snapshot/data/authors \
            --capture-dir snapshot/data/captures
      - name: Verify complete Scholar sources before publication
        run: |
          map-validate-scholar-coverage \
            --people source/registry/people.csv \
            --memberships source/registry/memberships.csv \
            --departments source/registry/departments.csv \
            --baseline source/registry/legacy-scholar-cache-baseline.json \
            --prior-id-crosswalk source/registry/reviews/2026-10-25-chem-donahue-prior-id-crosswalk.json \
            --curated-works source/data/curated/works.json \
            --exclusions source/data/curated/scholar-exclusions.json \
            --cache-dir snapshot/data/authors \
            --captures-dir snapshot/data/captures \
            --snapshot snapshot/snapshots/cmu-engineering-publications.parquet
      - name: Validate, enrich, and publish snapshot
        env:
          HF_OIDC_RESOURCE: datasets/ccm/cmu-engineering-publications
          HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
        run: |
          HF_TOKEN="$(hf auth token)"
          export HF_TOKEN
          map-publish-snapshot \
            --snapshot snapshot/snapshots/cmu-engineering-publications.parquet \
            --manifest snapshot/snapshots/cmu-engineering-publications.parquet.manifest.json \
            --people source/registry/people.csv \
            --memberships source/registry/memberships.csv \
            --departments source/registry/departments.csv \
            --math-cache-dir snapshot/data/authors \
            --math-capture-dir snapshot/data/captures \
            --scholar-cache-dir snapshot/data/authors \
            --scholar-captures-dir snapshot/data/captures \
            --scholar-baseline source/registry/legacy-scholar-cache-baseline.json \
            --scholar-prior-id-crosswalk source/registry/reviews/2026-10-25-chem-donahue-prior-id-crosswalk.json \
            --scholar-curated-works source/data/curated/works.json \
            --reviewed-exclusions source/data/curated/scholar-exclusions.json \
            --reviewed-metadata-corrections source/data/curated/scholar-metadata-corrections.json \
            --reviewed-doi-aliases source/data/curated/scholar-doi-aliases.json \
            --reviewed-contexts source/data/curated/scholar-contexts.json \
            --attribution-reviews source/data/curated/scholar-attribution-reviews.json \
            --profile-releases source/data/curated/scholar-profile-releases.json \
            --status-file snapshot/status/last-upload.json
      - name: Record upload receipt
        if: ${{ always() }}
        working-directory: snapshot
        run: |
          if [ ! -f status/last-upload.json ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/last-upload.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record central dataset upload [skip ci]"
          git push origin HEAD:automation/map-snapshot
