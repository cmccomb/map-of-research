name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-*.txt
      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Measure Chemistry release branch coverage
        run: |
          python -m pytest -q -o addopts='' \
            --cov --cov-branch --cov-config=tests/chem_coverage.ini \
            --cov-report=term-missing --cov-fail-under=75 \
            tests/test_chem_region_review.py \
            tests/test_chem_delta_release.py \
            tests/test_chem_intent_checkpoint.py
      - name: Check formatting and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Validate the canonical registry
        run: map-collect --dry-run --status-file /tmp/map-collection-plan.json
      - name: Validate held Anderson title aliases
        run: python scripts/validate_anderson_six_aliases.py
      - name: Require evidenced primary homes for included Scholar profiles
        run: python scripts/validate_primary_homes.py
      - name: Audit installed dependencies
        run: python -m pip_audit --local
      - name: Compile package and migration tools
        run: python -m compileall -q map_of_research scripts
