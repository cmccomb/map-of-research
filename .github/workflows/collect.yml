name: Collect bounded Scholar snapshot

on:
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Ignore the one-year freshness window (still bounded to two profiles)
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: central-scholar-collection-v1
  cancel-in-progress: false

jobs:
  collect:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out trusted collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: source
          persist-credentials: false
      - name: Check out resumable snapshot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: automation/map-snapshot
          path: snapshot
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/pyproject.toml
      - name: Install collector
        run: python -m pip install './source[collector]'
      - name: Synchronize the canonical registry and curated works
        id: registry
        run: |
          mkdir -p snapshot/registry
          cp source/registry/departments.csv snapshot/registry/departments.csv
          cp source/registry/schools.csv snapshot/registry/schools.csv
          cp source/registry/memberships.csv snapshot/registry/memberships.csv
          cp source/registry/people.csv snapshot/registry/people.csv
          mkdir -p snapshot/data/curated
          cp source/data/curated/works.json snapshot/data/curated/works.json
          cp source/data/curated/reported-faculty-coauthors.json snapshot/data/curated/reported-faculty-coauthors.json
          rm -f snapshot/registry/faculty.csv snapshot/registry/maps.csv
          if [ -z "$(git -C snapshot status --porcelain -- registry data/curated)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Collect at most two stale profiles
        id: collect
        working-directory: snapshot
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh || false }}
        run: |
          set +e
          arguments=(
            --max-profiles 2
            --min-age-days 365
            --publication-limit 200
            --request-delay-seconds 90
          )
          if [[ "$FORCE_REFRESH" == "true" ]]; then
            arguments+=(--force)
          fi
          map-collect "${arguments[@]}"
          collector_exit_code=$?
          set -e
          refreshed_profiles=$(python -c 'import json; print(len(json.load(open("status/last-collection.json"))["refreshed_profile_ids"]))')
          echo "exit_code=$collector_exit_code" >> "$GITHUB_OUTPUT"
          echo "refreshed_profiles=$refreshed_profiles" >> "$GITHUB_OUTPUT"
      - name: Build and validate changed snapshot
        id: snapshot
        if: ${{ steps.collect.outputs.exit_code == '0' && (steps.collect.outputs.refreshed_profiles != '0' || steps.registry.outputs.changed == 'true') }}
        working-directory: snapshot
        run: |
          map-validate-scholar-coverage \
            --baseline ../source/registry/legacy-scholar-cache-baseline.json \
            --prior-id-crosswalk ../source/registry/reviews/2026-10-25-chem-donahue-prior-id-crosswalk.json \
            --additional-prior-id-crosswalk ../source/registry/reviews/2026-10-25-chem-sullivan-prior-id-crosswalk.json \
            --additional-prior-id-crosswalk ../source/registry/reviews/2026-10-29-mccomb-prior-id-crosswalk.json \
            --curated-works ../source/data/curated/works.json \
            --exclusions ../source/data/curated/scholar-exclusions.json
          map-build-snapshot
          map-validate-snapshot \
            --snapshot snapshots/cmu-engineering-publications.parquet \
            --manifest snapshots/cmu-engineering-publications.parquet.manifest.json
      - name: Record validated snapshot or failure receipt
        if: ${{ always() }}
        working-directory: snapshot
        env:
          COLLECTOR_EXIT_CODE: ${{ steps.collect.outputs.exit_code }}
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python ../source/scripts/stage_collector_result.py \
            --collector-exit-code "$COLLECTOR_EXIT_CODE" \
            --snapshot-outcome "$SNAPSHOT_OUTCOME"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record bounded Scholar collection [skip ci]"
          git push origin HEAD:automation/map-snapshot
      - name: Surface collection or snapshot validation failure
        if: ${{ always() && (steps.collect.outputs.exit_code != '0' || steps.snapshot.outcome == 'failure') }}
        run: exit 1
